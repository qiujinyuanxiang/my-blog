<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>My Blog</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/articles">文章</a>
            <a href="/about">关于我</a>
        </nav>
        <button id="theme-btn">
            切换主题
        </button>
    </header>

    <main>
        <section class="articles">
            <h2>最新文章</h2>
            <input id="post-search">
            <p id="loading">正在加载...</p>
            <div id="post-list"></div>
        </section>
        <section class="about">
            <h2>关于我</h2>
            <p>这是我的个人博客。</p>
        </section>

        <section class="skills">
            <h2>我的技能</h2>
            <div class="skill-groups">
                <div class="skill-group">
                    <h3>前端开发</h3>
                    <ul>
                        <li>HTML</li>
                        <li>CSS</li>
                        <li>JavaScript</li>
                    </ul>
                </div>
                <div class="skill-group">
                    <h3>后端开发</h3>
                    <ul>
                        <li>Node.js</li>
                        <li>PostgreSQL</li>
                    </ul>
                </div>
                <div class="skill-group">
                    <h3>工程</h3>
                    <ul>
                        <li>Git</li>
                        <li>Docker</li>
                        <li>Linux</li>
                    </ul>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 My Blog</p>
    </footer>
    <script type="module" src="dist/main.js"></script>
</body>

</html>
